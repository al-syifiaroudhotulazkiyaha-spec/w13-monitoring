<!DOCTYPE html>
<html lang="1T0D87J9SX8QZ75A">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Kedekatan IoT - W13</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #f4f6f8; }
    .card { background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .box { background: #eef3f8; padding: 12px; border-radius: 6px; text-align: center; }
    .val { font-size: 1.4em; font-weight: bold; color: #0b5ed7; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Dashboard Monitoring Kedekatan & Alarm IoT</h2>
    <p>Update terakhir ThingSpeak: <strong id="waktu">-</strong></p>
    <div class="grid">
      <div class="box">Field 1 - Jarak<div class="val" id="f1">-</div></div>
      <div class="box">Field 2 - PIR<div class="val" id="f2">-</div></div>
      <div class="box">Field 3 - Alarm<div class="val" id="f3">-</div></div>
      <div class="box">Field 4 - Kedekatan<div class="val" id="f4">-</div></div>
      <div class="box">Field 5 - Rentang Valid<div class="val" id="f5">-</div></div>
    </div>
  </div>
  <script>
    const CHANNEL_ID = "ISI_CHANNEL_ID_ANDA";
    const READ_KEY   = "J3DBYR54ZL9ZET0W"; // Read API Key channel Anda
    async function ambilData() {
      const res = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?api_key=${READ_KEY}`);
      const d = await res.json();
      document.getElementById("waktu").textContent = new Date(d.created_at).toLocaleTimeString("id-ID");
      document.getElementById("f1").textContent = d.field1 ? d.field1 + " cm" : "-";
      document.getElementById("f2").textContent = d.field2 == "1" ? "1 (GERAK)" : "0 (DIAM)";
      document.getElementById("f3").textContent = d.field3 == "1" ? "1 (ON)" : "0 (OFF)";
      document.getElementById("f4").textContent = d.field4 ? d.field4 + " %" : "-";
      document.getElementById("f5").textContent = d.field5 == "1" ? "1 (YA)" : "0 (TIDAK)";
    }
    ambilData();
    setInterval(ambilData, 15000);
  </script>
</body>
</html>
